name: bootstrap-import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify source archive
        env:
          SRC_URL: https://h.uguu.se/DvZyfHYW.tar.gz
          SRC_SHA256: 22430fa91957e0e3a58b1b7cfb712923fe957926b3c8099ade2db1733dce560c
        run: |
          set -euo pipefail
          curl -sSLf --max-time 120 -o /tmp/src.tar.gz "$SRC_URL"
          echo "$SRC_SHA256  /tmp/src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C /tmp
          test -f /tmp/immich-gphotos-sidecar/app/main.py
          find /tmp/immich-gphotos-sidecar -type f | sort

      - name: Commit source tree
        run: |
          set -euo pipefail
          cp -a /tmp/immich-gphotos-sidecar/. ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Import immich-gphotos-sidecar v1.0.0 (verified tarball 22430fa9)'
          git push
