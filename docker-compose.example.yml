# 単体で動かす場合の例。Immich の docker compose に相乗りさせるなら
# docker-compose.immich.yml と docs/immich-compose.md を参照。
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env
#   docker compose pull
#   docker compose run --rm immich-gphotos-sidecar doctor
#   docker compose up -d
services:
  immich-gphotos-sidecar:
    # GitHub Actions が main / v* タグごとに自動ビルドして GHCR へ push している。
    # 本番は :sha-xxxxxxx や :v1.0.0 で固定するのが安全。
    image: ghcr.io/nmt3325/immich-gphotos-sidecar:latest
    # 自前でビルドしたい場合は上の image を消して build を有効化する
    # build:
    #   context: .
    #   args:
    #     # pin gotohp if you want reproducible images, e.g. GOTOHP_REF: v0.10.0
    #     GOTOHP_REF: main
    container_name: immich-gphotos-sidecar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./data/state:/state       # sqlite sync state (must persist)
      - ./data/sidecar:/sidecar   # sidecar JSON/XMP + album/library snapshots
      - ./data/config:/config     # gotohp credentials (must persist)
      - sidecar-work:/work        # scratch: downloads + staging (can be tmpfs)
    # Run as your own user if you want the sidecar files owned by you:
    # user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "stats"]
      interval: 10m
      timeout: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sidecar-work:
